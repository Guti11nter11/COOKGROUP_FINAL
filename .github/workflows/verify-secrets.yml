name: Verificar claves

on:
  workflow_dispatch:
  push:
    branches: [claude/vigilant-euler-pkmop0]
    paths: [.github/workflows/verify-secrets.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
      DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
      DISCORD_GUILD_ID: "1568641743853715516"
    steps:
      - name: Comprobar cada servicio (solo códigos HTTP, nunca valores)
        shell: bash
        run: |
          fail=0
          check() { # nombre, código esperado, curl args...
            local name="$1" want="$2"; shift 2
            local code; code=$(curl -s -o /tmp/body -w '%{http_code}' -m 30 "$@" || echo 000)
            if [ "$code" = "$want" ]; then echo "✅ $name ($code)"; else echo "❌ $name (HTTP $code)"; fail=1; fi
          }
          present() { if [ -n "${!1}" ]; then echo "✅ $1 presente"; else echo "❌ $1 VACÍO"; fail=1; fi; }

          check "Ticketmaster" 200 "https://app.ticketmaster.com/discovery/v2/events.json?size=1&countryCode=ES&apikey=$TICKETMASTER_API_KEY"
          check "Discord bot" 200 -H "Authorization: Bot $DISCORD_BOT_TOKEN" https://discord.com/api/v10/users/@me
          check "Discord bot en servidor GIRA" 200 -H "Authorization: Bot $DISCORD_BOT_TOKEN" "https://discord.com/api/v10/guilds/$DISCORD_GUILD_ID"
          code=$(curl -s -m 30 -H "Authorization: Bot $DISCORD_BOT_TOKEN" https://discord.com/api/v10/applications/@me -o /tmp/app -w '%{http_code}')
          if [ "$code" = 200 ] && python3 -c "import json,os,sys;d=json.load(open('/tmp/app'));sys.exit(0 if d.get('id')==os.environ['DISCORD_APPLICATION_ID'] and d.get('verify_key')==os.environ['DISCORD_PUBLIC_KEY'] else 1)"; then
            echo "✅ Discord APPLICATION_ID y PUBLIC_KEY coinciden con el bot"; else echo "❌ Discord APPLICATION_ID/PUBLIC_KEY no coinciden con el bot (HTTP $code)"; fail=1; fi
          perms=$(curl -s -m 30 -H "Authorization: Bot $DISCORD_BOT_TOKEN" "https://discord.com/api/v10/guilds/$DISCORD_GUILD_ID/roles" | python3 -c "import sys,json;r=json.load(sys.stdin);print(any(int(x.get('permissions','0'))&8 for x in r if x.get('managed')))" 2>/dev/null || echo False)
          if [ "$perms" = True ]; then echo "✅ Bot con permiso Administrador"; else echo "⚠️ Bot SIN Administrador (revisar rol GIRA)"; fi
          check "Groq" 200 -H "Authorization: Bearer $GROQ_API_KEY" https://api.groq.com/openai/v1/models
          check "Gemini" 200 -H "x-goog-api-key: $GEMINI_API_KEY" https://generativelanguage.googleapis.com/v1beta/models
          check "NVIDIA" 200 -H "Authorization: Bearer $NVIDIA_API_KEY" https://integrate.api.nvidia.com/v1/models
          check "OpenAI" 200 -H "Authorization: Bearer $OPENAI_API_KEY" https://api.openai.com/v1/models
          check "Firecrawl" 200 -H "Authorization: Bearer $FIRECRAWL_API_KEY" https://api.firecrawl.dev/v1/team/credit-usage
          check "Apify" 200 -H "Authorization: Bearer $APIFY_TOKEN" https://api.apify.com/v2/users/me
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          [ "$code" = 200 ] || code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          if [ "$code" = 200 ]; then echo "✅ Cloudflare token (200)"; else echo "❌ Cloudflare token (HTTP $code)"; fail=1; fi
          check "Cloudflare Workers (permiso)" 200 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          check "Cloudflare D1 (permiso)" 200 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          check "Cloudflare Pages (permiso)" 200 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          check "Last.fm" 200 "https://ws.audioscrobbler.com/2.0/?method=artist.getinfo&artist=U2&format=json&api_key=$LASTFM_API_KEY"
          if grep -q '"error"' /tmp/body; then echo "❌ Last.fm devuelve error de clave"; fail=1; fi
          check "football-data.org" 200 -H "X-Auth-Token: $FOOTBALL_DATA_API_KEY" "https://api.football-data.org/v4/competitions/PD/matches?status=SCHEDULED&limit=1"
          exit $fail

      # Informativo: no falla nunca. Comprueba permisos finos y cuotas que la arquitectura
      # necesita. El repo es público: solo imprime códigos, recuentos y nombres públicos.
      - name: Permisos finos, cuotas y calidad de datos (informativo)
        if: always()
        continue-on-error: true
        shell: python
        run: |
          import json, os, urllib.request, urllib.error, datetime as dt
          from collections import Counter

          def req(url, headers=None, method="GET", body=None):
              data = json.dumps(body).encode() if body is not None else None
              # Discord y Groq (tras Cloudflare) rechazan el User-Agent por defecto de urllib.
              h = {"User-Agent": "DiscordBot (https://github.com/Guti11nter11/COOKGROUP_FINAL, 0.1) GIRA-verify"}
              h.update(headers or {})
              if data is not None:
                  h["Content-Type"] = "application/json"
              r = urllib.request.Request(url, headers=h, method=method, data=data)
              try:
                  with urllib.request.urlopen(r, timeout=40) as resp:
                      return resp.status, {k.lower(): v for k, v in resp.headers.items()}, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, {k.lower(): v for k, v in e.headers.items()}, e.read()
              except Exception as e:  # red, timeout…
                  return 0, {}, repr(e).encode()

          def js(b):
              try:
                  return json.loads(b)
              except Exception:
                  return {}

          def cf_errs(b):
              d = js(b)
              e = (d.get("errors") or []) if isinstance(d, dict) else []
              return [f"{x.get('code')}: {x.get('message')}" for x in e][:1]

          def section(t):
              print(f"\n=== {t} ===")

          E = os.environ
          section("Cloudflare: permisos por producto")
          acct, cf = E["CLOUDFLARE_ACCOUNT_ID"], {"Authorization": f"Bearer {E['CLOUDFLARE_API_TOKEN']}"}
          base = f"https://api.cloudflare.com/client/v4/accounts/{acct}"
          for name, path in [("KV", "storage/kv/namespaces"), ("R2", "r2/buckets"), ("Queues", "queues"),
                             ("Vectorize", "vectorize/v2/indexes"), ("Workers AI (catálogo)", "ai/models/search?per_page=1"),
                             ("AI Gateway", "ai-gateway/gateways"), ("Durable Objects", "workers/durable_objects/namespaces"),
                             ("Subdominio workers.dev", "workers/subdomain"), ("Cron triggers (scripts)", "workers/scripts")]:
              code, _, b = req(f"{base}/{path}", cf)
              errs = cf_errs(b)
              print(("✅" if code == 200 else "❌"), f"{name}: HTTP {code}", *errs)
          code, _, b = req(f"{base}/ai/run/@cf/meta/llama-3.1-8b-instruct-fp8-fast", cf, "POST",
                           {"messages": [{"role": "user", "content": "Responde solo: ok"}], "max_tokens": 5})
          print(("✅" if code == 200 else "❌"), f"Workers AI (inferencia): HTTP {code}")
          code, _, b = req(f"{base}/browser-rendering/content", cf, "POST", {"url": "https://example.com"})
          errs = cf_errs(b)
          print(("✅" if code == 200 else "❌"), f"Browser Run (/content): HTTP {code}", *errs)

          section("Ticketmaster: cuota y calidad de datos (música, próximos eventos)")
          tm = E["TICKETMASTER_API_KEY"]
          now = dt.datetime.now(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          names, avail = Counter(), None
          for cc in ["ES", "GB", "IE", "FR", "DE", "IT", "PT", "NL", "BE", "US", "MX", "AU"]:
              url = ("https://app.ticketmaster.com/discovery/v2/events.json?classificationName=music&size=200"
                     f"&sort=date,asc&startDateTime={now}&countryCode={cc}&apikey={tm}")
              code, h, b = req(url)
              avail = h.get("rate-limit-available", avail)
              d = js(b)
              ev = d.get("_embedded", {}).get("events", [])
              total = d.get("page", {}).get("totalElements")
              pre = [e for e in ev if e.get("sales", {}).get("presales")]
              for e in pre:
                  for p in e["sales"]["presales"]:
                      names[p.get("name", "?")] += 1
              pr = sum(1 for e in ev if e.get("priceRanges"))
              tl = sum(1 for e in ev if e.get("ticketLimit"))
              print(f"{cc}: HTTP {code} · total={total} · muestra={len(ev)} · con preventas={len(pre)} · con precios={pr} · con límite={tl}")
          print("Cuota restante hoy:", avail, "· tipos de preventa más vistos:", names.most_common(15))
          url = ("https://app.ticketmaster.com/discovery/v2/events.json?classificationName=music&size=15"
                 f"&sort=onSaleStartDate,asc&onsaleStartDateTime={now}&countryCode=ES&apikey={tm}")
          code, _, b = req(url)
          print("Próximas salidas a la venta en ES:")
          for e in js(b).get("_embedded", {}).get("events", []):
              s = e.get("sales", {})
              print("  ·", e.get("name"), "|", e.get("dates", {}).get("start", {}).get("localDate"),
                    "| venta:", s.get("public", {}).get("startDateTime"), "| preventas:", len(s.get("presales", [])))

          section("Ticketmaster: ¿acepta varios attractionId en una llamada?")
          ids = {}
          for kw in ["U2", "Oasis", "Metallica"]:
              code, _, b = req(f"https://app.ticketmaster.com/discovery/v2/attractions.json?keyword={kw}&classificationName=music&size=1&apikey={tm}")
              a = (js(b).get("_embedded", {}).get("attractions") or [{}])[0]
              ids[kw] = a.get("id")
              print(f"{kw}: attraction={a.get('id')} · próximos eventos={a.get('upcomingEvents', {}).get('_total')}")
          single = {}
          for kw, aid in ids.items():
              code, _, b = req(f"https://app.ticketmaster.com/discovery/v2/events.json?attractionId={aid}&size=1&apikey={tm}")
              single[kw] = js(b).get("page", {}).get("totalElements")
          code, _, b = req(f"https://app.ticketmaster.com/discovery/v2/events.json?attractionId={','.join(i for i in ids.values() if i)}&size=1&apikey={tm}")
          multi = js(b).get("page", {}).get("totalElements")
          print(f"Por separado={single} · suma={sum(v or 0 for v in single.values())} · en una llamada (coma)={multi} · HTTP {code}")

          section("Ticketmaster Discovery Feed (catálogo completo por país)")
          code, _, b = req(f"https://app.ticketmaster.com/discovery-feed/v2/events?apikey={tm}")
          meta = js(b)
          print("Metadatos: HTTP", code, "· claves:", list(meta.keys())[:8] if isinstance(meta, dict) else type(meta).__name__)
          countries = meta.get("countries") if isinstance(meta, dict) else None
          if isinstance(countries, dict):
              for cc in ["ES", "GB", "IE", "FR", "DE", "IT", "NL", "BE", "PT", "US", "MX"]:
                  c = countries.get(cc) or {}
                  j = c.get("JSON") or c.get("json") or {}
                  print(f"  {cc}: eventos={j.get('num_events')} · tamaño={j.get('file_size')} · actualizado={j.get('last_updated')}")
          import gzip, io
          from collections import Counter
          code, h, b = req(f"https://app.ticketmaster.com/discovery-feed/v2/events.json?apikey={tm}&countryCode=ES")
          print("Feed ES: HTTP", code, "·", len(b), "bytes ·", h.get("content-type"))
          d = js(b)
          if not d and b[:2] == b"\x1f\x8b":
              d = json.loads(gzip.decompress(b))
          if isinstance(d, dict) and "events" not in d:
              print("  estructura:", list(d.keys())[:6])
              url = (d.get("url") or d.get("uri") or "")
              if url:
                  code2, _, b2 = req(url)
                  print("  descarga:", code2, len(b2), "bytes")
                  try: d = json.loads(gzip.decompress(b2))
                  except Exception: d = js(b2)
          evs = d.get("events", []) if isinstance(d, dict) else []
          print("  eventos en ES:", len(evs))
          if evs:
              seg = Counter((e.get("classificationSegment") or "?") for e in evs)
              print("  por segmento:", seg.most_common(6))
              print("  con preventas:", sum(1 for e in evs if e.get("presales")), "· hotEvent:", sum(1 for e in evs if e.get("hotEvent")),
                    "· con onsaleStartDateTime:", sum(1 for e in evs if e.get("onsaleStartDateTime")))
              print("  campos del primer evento:", sorted(evs[0].keys())[:60])
              nfl = [e.get("eventName") for e in evs if "NFL" in (e.get("eventName") or "") or "Falcons" in (e.get("eventName") or "")][:3]
              print("  NFL:", nfl)

          section("Apify: plan y consumo del mes (sin datos de cuenta)")
          ap = {"Authorization": f"Bearer {E['APIFY_TOKEN']}"}
          code, _, b = req("https://api.apify.com/v2/users/me/limits", ap)
          d = js(b).get("data", {})
          print(f"HTTP {code} · consumo mes USD={d.get('current', {}).get('monthlyUsageUsd')} · tope USD={d.get('limits', {}).get('maxMonthlyUsageUsd')}")
          code, _, b = req("https://api.apify.com/v2/users/me", ap)
          p = js(b).get("data", {}).get("plan", {})
          print("Plan:", p.get("id"), "· crédito mensual USD:", p.get("monthlyUsageCreditsUsd"), "· proxies:", p.get("availableProxyGroups"))

          section("Discord: estado del servidor GIRA")
          dh = {"Authorization": f"Bot {E['DISCORD_BOT_TOKEN']}"}
          g = E["DISCORD_GUILD_ID"]
          code, _, b = req(f"https://discord.com/api/v10/guilds/{g}/channels", dh)
          ch = js(b) if code == 200 else []
          kinds = Counter({0: "texto", 2: "voz", 4: "categoría", 5: "anuncios", 13: "escenario", 15: "foro"}.get(c.get("type"), str(c.get("type"))) for c in ch)
          print(f"HTTP {code} · canales={len(ch)} · por tipo={dict(kinds)}")
          print("Categorías:", [c.get("name") for c in ch if c.get("type") == 4])
          code, _, b = req(f"https://discord.com/api/v10/guilds/{g}", dh)
          print("Features del servidor:", js(b).get("features"))
          code, _, b = req("https://discord.com/api/v10/applications/@me", dh)
          print("Interactions endpoint configurado:", bool(js(b).get("interactions_endpoint_url")))
          code, _, b = req(f"https://discord.com/api/v10/applications/{E['DISCORD_APPLICATION_ID']}/guilds/{g}/commands", dh)
          print(f"Slash commands registrados en GIRA: HTTP {code} · {len(js(b)) if code == 200 else '-'}")
          code, _, b = req(f"https://discord.com/api/v10/guilds/{g}/scheduled-events", dh)
          print(f"Eventos programados (permiso): HTTP {code}")

          section("IA: modelos disponibles")
          code, _, b = req("https://api.groq.com/openai/v1/models", {"Authorization": f"Bearer {E['GROQ_API_KEY']}"})
          print("Groq:", sorted(m["id"] for m in js(b).get("data", []))[:30])
          code, _, b = req("https://generativelanguage.googleapis.com/v1beta/models?pageSize=200", {"x-goog-api-key": E["GEMINI_API_KEY"]})
          print("Gemini (flash/pro):", sorted(m["name"].split("/")[-1] for m in js(b).get("models", []) if "flash" in m["name"] or "pro" in m["name"])[:30])

          section("GitHub: token para que el Worker lance workflows (GH_DISPATCH_TOKEN)")
          if not E.get("GH_DISPATCH_TOKEN"):
              print("⏳ GH_DISPATCH_TOKEN aún no creado")
          else:
              code, _, b = req("https://api.github.com/repos/Guti11nter11/COOKGROUP_FINAL/actions/workflows",
                               {"Authorization": f"Bearer {E['GH_DISPATCH_TOKEN']}", "Accept": "application/vnd.github+json"})
              print(("✅" if code == 200 else "❌"), f"Acceso a Actions del repo: HTTP {code} · workflows={js(b).get('total_count')}")

          section("Otras cuotas")
          code, _, b = req("https://api.firecrawl.dev/v1/team/credit-usage", {"Authorization": f"Bearer {E['FIRECRAWL_API_KEY']}"})
          print("Firecrawl créditos restantes:", js(b).get("data", {}).get("remaining_credits"))
          code, h, b = req("https://api.football-data.org/v4/competitions", {"X-Auth-Token": E["FOOTBALL_DATA_API_KEY"]})
          comps = [c.get("code") for c in js(b).get("competitions", [])]
          print(f"football-data: HTTP {code} · competiciones={comps} · peticiones/min restantes={h.get('x-requests-available-minute')}")
