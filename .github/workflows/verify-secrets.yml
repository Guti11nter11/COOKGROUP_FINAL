name: Verificar claves

on:
  workflow_dispatch:
  push:
    branches: [claude/vigilant-euler-pkmop0]
    paths: [.github/workflows/verify-secrets.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
      DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      DISCORD_GUILD_ID: "1568641743853715516"
    steps:
      - name: Comprobar cada servicio (solo códigos HTTP, nunca valores)
        shell: bash
        run: |
          fail=0
          check() { # nombre, código esperado, curl args...
            local name="$1" want="$2"; shift 2
            local code; code=$(curl -s -o /tmp/body -w '%{http_code}' -m 30 "$@" || echo 000)
            if [ "$code" = "$want" ]; then echo "✅ $name ($code)"; else echo "❌ $name (HTTP $code)"; fail=1; fi
          }
          present() { if [ -n "${!1}" ]; then echo "✅ $1 presente"; else echo "❌ $1 VACÍO"; fail=1; fi; }

          check "Ticketmaster" 200 "https://app.ticketmaster.com/discovery/v2/events.json?size=1&countryCode=ES&apikey=$TICKETMASTER_API_KEY"
          check "Discord bot" 200 -H "Authorization: Bot $DISCORD_BOT_TOKEN" https://discord.com/api/v10/users/@me
          check "Discord bot en servidor GIRA" 200 -H "Authorization: Bot $DISCORD_BOT_TOKEN" "https://discord.com/api/v10/guilds/$DISCORD_GUILD_ID"
          code=$(curl -s -m 30 -H "Authorization: Bot $DISCORD_BOT_TOKEN" https://discord.com/api/v10/applications/@me -o /tmp/app -w '%{http_code}')
          if [ "$code" = 200 ] && python3 -c "import json,os,sys;d=json.load(open('/tmp/app'));sys.exit(0 if d.get('id')==os.environ['DISCORD_APPLICATION_ID'] and d.get('verify_key')==os.environ['DISCORD_PUBLIC_KEY'] else 1)"; then
            echo "✅ Discord APPLICATION_ID y PUBLIC_KEY coinciden con el bot"; else echo "❌ Discord APPLICATION_ID/PUBLIC_KEY no coinciden con el bot (HTTP $code)"; fail=1; fi
          perms=$(curl -s -m 30 -H "Authorization: Bot $DISCORD_BOT_TOKEN" "https://discord.com/api/v10/guilds/$DISCORD_GUILD_ID/roles" | python3 -c "import sys,json;r=json.load(sys.stdin);print(any(int(x.get('permissions','0'))&8 for x in r if x.get('managed')))" 2>/dev/null || echo False)
          if [ "$perms" = True ]; then echo "✅ Bot con permiso Administrador"; else echo "⚠️ Bot SIN Administrador (revisar rol GIRA)"; fi
          check "Groq" 200 -H "Authorization: Bearer $GROQ_API_KEY" https://api.groq.com/openai/v1/models
          check "Gemini" 200 -H "x-goog-api-key: $GEMINI_API_KEY" https://generativelanguage.googleapis.com/v1beta/models
          check "NVIDIA" 200 -H "Authorization: Bearer $NVIDIA_API_KEY" https://integrate.api.nvidia.com/v1/models
          check "OpenAI" 200 -H "Authorization: Bearer $OPENAI_API_KEY" https://api.openai.com/v1/models
          check "Firecrawl" 200 -H "Authorization: Bearer $FIRECRAWL_API_KEY" https://api.firecrawl.dev/v1/team/credit-usage
          check "Apify" 200 -H "Authorization: Bearer $APIFY_TOKEN" https://api.apify.com/v2/users/me
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify)
          [ "$code" = 200 ] || code=$(curl -s -o /dev/null -w '%{http_code}' -m 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")
          if [ "$code" = 200 ]; then echo "✅ Cloudflare token (200)"; else echo "❌ Cloudflare token (HTTP $code)"; fail=1; fi
          check "Cloudflare Workers (permiso)" 200 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          check "Cloudflare D1 (permiso)" 200 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"
          check "Cloudflare Pages (permiso)" 200 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          check "Last.fm" 200 "https://ws.audioscrobbler.com/2.0/?method=artist.getinfo&artist=U2&format=json&api_key=$LASTFM_API_KEY"
          if grep -q '"error"' /tmp/body; then echo "❌ Last.fm devuelve error de clave"; fail=1; fi
          exit $fail
