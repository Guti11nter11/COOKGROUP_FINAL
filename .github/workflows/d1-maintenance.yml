name: Mantenimiento D1

# Ejecuta un fichero SQL de apps/worker/maintenance/ contra la D1 de producción.

on:
  workflow_dispatch:
  push:
    branches: [claude/magical-franklin-u415fe]
    paths: [apps/worker/maintenance/**]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Ejecutar los SQL nuevos de este commit
        run: |
          id=$(npx wrangler d1 list --json | python3 -c "import sys,json;print(next(d['uuid'] for d in json.load(sys.stdin) if d['name']=='gira'))")
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
          for f in $(git diff --name-only HEAD~1 HEAD -- maintenance/ | sed 's#apps/worker/##'); do
            echo "== $f"
            python3 - "$f" <<'PY'
          import json, subprocess, sys
          sql = open(sys.argv[1]).read()
          # Sin líneas de comentario: wrangler tomaría "-- …" por una opción.
          stmts = ["\n".join(l for l in s.splitlines() if not l.strip().startswith("--")).strip() for s in sql.split(";")]
          stmts = [s for s in stmts if s]
          for st in stmts:
              out = subprocess.run(["npx", "wrangler", "d1", "execute", "gira", "--remote", "--json", f"--command={st}"], capture_output=True, text=True).stdout
              try:
                  d = json.loads(out[out.index("["):])
              except Exception:
                  print("salida no JSON:", out[:1500]); continue
              for r in d:
                  rows = r.get("results") or []
                  print(f"> {st.splitlines()[0][:90]} · cambios={(r.get('meta') or {}).get('changes')} · filas={len(rows)}")
                  for row in rows[:40]: print("   ", row)
          PY
          done
