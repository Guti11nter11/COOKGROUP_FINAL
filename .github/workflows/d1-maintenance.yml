name: Mantenimiento D1

# Ejecuta un fichero SQL de apps/worker/maintenance/ contra la D1 de producción.

on:
  workflow_dispatch:
  push:
    branches: [claude/magical-franklin-u415fe]
    paths: [apps/worker/maintenance/**]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Ejecutar los SQL nuevos de este commit
        run: |
          id=$(npx wrangler d1 list --json | python3 -c "import sys,json;print(next(d['uuid'] for d in json.load(sys.stdin) if d['name']=='gira'))")
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
          for f in $(git diff --name-only HEAD~1 HEAD -- maintenance/ | sed 's#apps/worker/##'); do
            echo "== $f"; npx wrangler d1 execute gira --remote --file "$f" --yes --json > /tmp/out.json || true
            python3 - <<'PY'
          import json
          try:
              d = json.load(open("/tmp/out.json"))
          except Exception as e:
              print("salida no JSON:", open("/tmp/out.json").read()[:2000]); raise SystemExit(0)
          for r in d if isinstance(d, list) else [d]:
              rows = r.get("results") or []
              print("cambios:", (r.get("meta") or {}).get("changes"), "· filas:", len(rows))
              for row in rows: print("  ", row)
          PY
          done
