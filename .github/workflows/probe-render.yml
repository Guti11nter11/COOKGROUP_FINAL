name: Diagnóstico de render (Browser Run)

# Manual: renderiza unas URLs con Browser Run y muestra formularios y enlaces (para ajustar lectores).

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separadas por espacios"
        required: true
  push:
    branches: [claude/magical-franklin-u415fe]
    paths: [.github/workflows/probe-render.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Renderizar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          URLS: ${{ inputs.urls || 'https://www.elcorteingles.es/entradas/ https://www.elcorteingles.es/entradas/buscar/?term=U2 https://www.axs.com/uk https://www.axs.com/uk/search?q=Oasis' }}
        run: npx tsx apps/jobs/src/probe-render.ts
