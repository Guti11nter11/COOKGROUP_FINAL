name: Radar Discovery Feed

# Cada hora lee el catálogo completo de Ticketmaster de los países de la Fase 1, se queda con
# las fechas de las ~1.000 entidades seguidas (artistas, festivales, deporte) y envía al Worker
# solo lo que cambió. El estado anterior se guarda en la caché de Actions.

on:
  # Lo lanza el Worker a horas fijas de Madrid (packages/core/src/schedule.ts, JOB_SLOTS): los
  # schedule de GitHub se saltaban la mayoría de las pasadas.
  workflow_dispatch:
  push:
    branches: [claude/magical-franklin-u415fe]
    paths: [.github/workflows/feed-radar.yml, apps/jobs/src/feed-radar.ts, apps/jobs/src/tm-feed.ts]

permissions:
  contents: read

concurrency:
  group: feed-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Estado anterior
        uses: actions/cache/restore@v4
        with:
          path: .feed-state
          key: feed-state-${{ github.run_id }}
          restore-keys: feed-state-
      - run: mkdir -p .feed-state
      - name: Leer feeds y enviar cambios
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npx tsx apps/jobs/src/feed-radar.ts
      - name: Guardar estado
        uses: actions/cache/save@v4
        with:
          path: .feed-state
          key: feed-state-${{ github.run_id }}
