name: Montar servidor de Discord

# Crea las categorías y canales temáticos que falten en el servidor GIRA y registra los comandos.
# Idempotente: nunca borra ni renombra nada (los canales por artista los gestiona el Worker).

on:
  workflow_dispatch:
  push:
    branches: [claude/magical-franklin-u415fe]
    paths: [.github/workflows/discord-setup.yml, packages/core/src/discord.ts]

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Crear lo que falte
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: "1568641743853715516"
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
        run: npx tsx apps/jobs/src/discord-setup.ts
