name: Sondear ticketeras

# Diagnóstico manual: ¿qué ticketeras sin API se pueden leer desde los servidores de GIRA
# (GitHub Actions y Cloudflare Browser Run) respetando robots.txt y sin saltar bloqueos?
# Solo imprime códigos, tamaños y recuentos. No toca colas ni páginas de compra.

on:
  workflow_dispatch:
  push:
    branches: [claude/magical-franklin-u415fe]
    paths: [.github/workflows/probe-ticketers.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Lectura directa desde GitHub Actions y con Browser Run
        shell: python
        run: |
          import json, os, re, time, urllib.request, urllib.error

          UA = "GIRA/0.1 (+https://github.com/Guti11nter11/COOKGROUP_FINAL) lector moderado de fichas de evento"
          SITES = {
              "Ticketmaster FR (portada)": ["https://www.ticketmaster.fr/robots.txt", "https://www.ticketmaster.fr/fr"],
              "Ticketmaster FR (artista U2)": ["https://www.ticketmaster.fr/fr/artiste/u2/idartiste/1131"],
              "MEO Blueticket (portada)": ["https://blueticket.meo.pt/robots.txt", "https://blueticket.meo.pt/pt/"],
              "MEO Blueticket (pesquisa U2)": ["https://blueticket.meo.pt/pt/search?q=U2"],
          }

          def get(url):
              r = urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "text/html,application/xml;q=0.9,*/*;q=0.8"})
              try:
                  with urllib.request.urlopen(r, timeout=25) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as e:
                  return e.code, e.read()
              except Exception as e:
                  return 0, type(e).__name__.encode()

          def describe(body):
              t = body[:400000].decode("utf-8", "ignore")
              flags = []
              if "queue-it" in t.lower(): flags.append("queue-it")
              if "captcha" in t.lower() or "challenge" in t.lower(): flags.append("reto/captcha")
              ld = t.count("application/ld+json")
              ev = len(re.findall(r'"@type"\s*:\s*"(?:Music)?Event"', t))
              sm = re.findall(r"(?im)^sitemap:\s*(\S+)", t)
              return f"{len(body)}B ld+json={ld} eventos={ev} sitemaps={len(sm)} {' '.join(flags)}".strip(), sm

          print("=== Desde GitHub Actions (lectura directa) ===")
          sitemaps = {}
          for name, urls in SITES.items():
              for u in urls:
                  code, body = get(u)
                  d, sm = describe(body) if code else (body.decode(), [])
                  if sm: sitemaps[name] = sm[:3]
                  print(f"{'✅' if code == 200 else '❌'} {name} · HTTP {code} · {d} · {u}")
                  time.sleep(2)
          print("\nSitemaps declarados en robots.txt:")
          for k, v in sitemaps.items(): print(f"  {k}: {v}")

          print("\n=== Con Cloudflare Browser Run (navegador real, 1 cada 11 s) ===")
          acct, tok = os.environ["CLOUDFLARE_ACCOUNT_ID"], os.environ["CLOUDFLARE_API_TOKEN"]
          for name, urls in SITES.items():
              u = urls[-1]
              if u.endswith("robots.txt"): continue
              req = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/accounts/{acct}/browser-rendering/content",
                  data=json.dumps({"url": u, "gotoOptions": {"waitUntil": "networkidle0", "timeout": 45000}}).encode(),
                  headers={"Authorization": f"Bearer {tok}", "Content-Type": "application/json"}, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      d = json.loads(resp.read())
                      html = (d.get("result") or "").encode()
                      t = html.decode("utf-8", "ignore")
                      title = re.search(r"<title[^>]*>(.*?)</title>", t, re.S)
                      print(f"✅ {name} · Browser Run 200 · {describe(html)[0]} · título={title.group(1).strip()[:80] if title else '-'} · {u}")
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "ignore")[:160]
                  print(f"❌ {name} · Browser Run HTTP {e.code} · {body} · {u}")
              except Exception as e:
                  print(f"❌ {name} · Browser Run {type(e).__name__} · {u}")
              time.sleep(11)
