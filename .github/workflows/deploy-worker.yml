name: Desplegar Worker

# Despliega gira-core en Cloudflare: crea la base D1 y la cola si no existen, aplica migraciones,
# carga los artistas seguidos solo si su fichero cambió (cada carga son miles de escrituras de D1 y el
# plan gratuito permite 100.000 al día), despliega y guarda los secretos del Worker.

on:
  workflow_dispatch:
  push:
    branches: [claude/magical-franklin-u415fe]
    paths:
      - apps/worker/**
      - packages/core/src/**
      - data/presale-kinds.json
      - .github/workflows/deploy-worker.yml

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Tests
        run: npm run typecheck && npm test
        working-directory: .

      - name: Base de datos D1 "gira" (crear si falta)
        run: |
          id=$(npx wrangler d1 list --json | python3 -c "import sys,json;print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='gira'),''))")
          if [ -z "$id" ]; then
            npx wrangler d1 create gira --location weur >/dev/null
            id=$(npx wrangler d1 list --json | python3 -c "import sys,json;print(next(d['uuid'] for d in json.load(sys.stdin) if d['name']=='gira'))")
            echo "Creada D1 gira"
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
          echo "D1 gira lista"

      - name: Cola "gira-sweep" (crear si falta)
        run: |
          if ! npx wrangler queues list 2>/dev/null | grep -q "gira-sweep"; then npx wrangler queues create gira-sweep; fi
          echo "Cola lista"

      - name: Migraciones y artistas seguidos
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          npx wrangler d1 migrations apply gira --remote
          # La semilla solo se carga si cambió en este push (o en un lanzamiento manual).
          if [ "${{ github.event_name }}" != "push" ] || ! git cat-file -e "$BEFORE" 2>/dev/null || git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -q '^apps/worker/seed/artists.sql$'; then
            npx wrangler d1 execute gira --remote --file seed/artists.sql --yes >/dev/null
            echo "Semilla de artistas cargada"
          else
            echo "Semilla sin cambios: no se carga (ahorra escrituras de D1)"
          fi
          npx wrangler d1 execute gira --remote --command "SELECT COUNT(*) AS artistas FROM artist" --json | python3 -c "import sys,json;print('Artistas en D1:', json.load(sys.stdin)[0]['results'][0]['artistas'])"

      - name: Desplegar
        run: npx wrangler deploy

      - name: Secretos del Worker
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          python3 -c "import json,os;print(json.dumps({k: os.environ[k] for k in ['TICKETMASTER_API_KEY','DISCORD_BOT_TOKEN','DISCORD_PUBLIC_KEY','GH_DISPATCH_TOKEN'] if os.environ.get(k)}))" > /tmp/secrets.json
          npx wrangler secret bulk /tmp/secrets.json
          rm -f /tmp/secrets.json

      - name: Comprobar /health
        run: |
          sleep 5
          curl -sS --max-time 20 https://gira-core.eleven-snk-11.workers.dev/health | python3 -c "import sys,json;d=json.load(sys.stdin);print('ok:',d['ok'],'· artistas:',d['counts']['artists'])"
