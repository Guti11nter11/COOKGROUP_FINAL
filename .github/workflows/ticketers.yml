name: Ticketeras sin API

# Dos veces al día, por turnos: búsqueda de cada artista ⭐⭐⭐ en Entradas.com y See Tickets (El Corte Inglés y AXS, pendientes de ajuste),
# See Tickets y AXS con Cloudflare Browser Run (navegador real, baja frecuencia, sin tocar colas).

on:
  # Lo lanza el Worker a horas fijas de Madrid (packages/core/src/schedule.ts, JOB_SLOTS).
  workflow_dispatch:
  push:
    branches: [claude/magical-franklin-u415fe]
    paths: [.github/workflows/ticketers.yml, apps/jobs/src/ticketers*.ts]

permissions:
  contents: read

concurrency:
  group: ticketers
  cancel-in-progress: false

jobs:
  ticketers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Estado anterior
        uses: actions/cache/restore@v4
        with:
          path: .ticketers-state
          key: ticketers-state-${{ github.run_id }}
          restore-keys: ticketers-state-
      - name: Leer ticketeras
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx tsx apps/jobs/src/ticketers.ts
      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ticketers-state
          key: ticketers-state-${{ github.run_id }}
